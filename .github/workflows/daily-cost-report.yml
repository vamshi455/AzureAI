name: Daily Azure Cost Report

on:
  schedule:
    # Run daily at 8:00 AM EST (13:00 UTC)
    - cron: "0 13 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  id-token: write   # OIDC auth to Azure
  contents: read
  issues: write      # Create GitHub Issues

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  cost-report:
    name: Generate & Send Cost Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cost report
        run: |
          python scripts/ops/daily_cost_report.py \
            --subscription-id ${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --output /tmp/cost-report.md

      - name: Read report content
        id: report
        run: |
          # Store report body for the issue
          REPORT=$(cat /tmp/cost-report.md)
          echo "report<<REPORT_EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "REPORT_EOF" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Close previous cost report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Close any open cost-report issues (keep only latest)
          gh issue list --label "cost-report" --state open --json number -q '.[].number' | \
            xargs -I{} gh issue close {} --comment "Superseded by new daily report" 2>/dev/null || true

      - name: Create GitHub Issue with report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Azure Cost Report - ${{ steps.report.outputs.date }}" \
            --body "$(cat /tmp/cost-report.md)" \
            --label "cost-report" \
            --assignee "vamshi455"
